<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASUD ADMIN - dual send</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* previous styles, only adding new button style */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .login-container {
            max-width: 400px; margin: 100px auto; background: white; padding: 40px;
            border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-container h2 { text-align: center; margin-bottom: 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-container input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 10px; }
        .login-container button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; }
        .error-message { color: #f44336; text-align: center; margin-top: 10px; display: none; }

        .admin-container { max-width: 1200px; margin: 0 auto; display: none; }
        .admin-header {
            background: white; padding: 30px; border-radius: 20px; margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); position: relative;
        }
        .admin-header h1 {
            font-size: 2.5em; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .btn-logout { position: absolute; top: 20px; right: 20px; background: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .input-form { background: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px;
            font-size: 14px; font-family: 'Poppins', sans-serif;
        }
        .form-group textarea { height: 150px; resize: vertical; }
        .code-editor { font-family: 'Courier New', monospace !important; background: #1e1e1e !important; color: #d4d4d4 !important; }
        .button-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .btn {
            padding: 15px 25px; border: none; border-radius: 10px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 10px; font-size: 16px;
            flex: 1 1 auto;
        }
        .btn-preview-only { background: #2196F3; color: white; }  /* shudhu preview pathanor jonno */
        .btn-preview-code { background: #4caf50; color: white; }  /* preview+code pathanor jonno */
        .btn-secondary { background: #ff9800; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .admin-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .card-image { width: 100%; height: 150px; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 15px; }
        .type-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; color: white; margin-bottom: 8px;
        }
        .type-badge.preview-only { background: #2196F3; }  /* shudhu preview */
        .type-badge.preview-code { background: #4caf50; }  /* preview+code */
        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .card-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .card-btn.edit { background: #2196F3; color: white; }
        .card-btn.delete { background: #f44336; color: white; }

        .preview-modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 2000; padding: 30px; overflow-y: auto;
        }
        .preview-modal.active { display: flex; align-items: center; justify-content: center; }
        .preview-content {
            background: white; padding: 30px; border-radius: 20px; max-width: 900px; width: 100%;
            max-height: 80vh; overflow-y: auto; position: relative;
        }
        .preview-close {
            position: absolute; top: 15px; right: 15px; width: 40px; height: 40px;
            border-radius: 50%; background: #f44336; color: white; border: none; cursor: pointer;
        }
        .preview-iframe { width: 100%; height: 400px; border: 2px solid #eee; border-radius: 10px; margin-top: 20px; }

        .notification {
            position: fixed; top: 20px; right: 20px; background: #4caf50; color: white;
            padding: 15px 25px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transform: translateX(400px); transition: transform 0.3s; z-index: 1000;
        }
        .notification.show { transform: translateX(0); }
        .notification.error { background: #f44336; }

        .loader {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); z-index: 2000; align-items: center; justify-content: center;
        }
        .loader.active { display: flex; }
        .loader-spinner {
            width: 60px; height: 60px; border: 5px solid #f3f3f3; border-top: 5px solid #667eea;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- login form (same as before) -->
    <div class="login-container" id="loginForm">
        <h2><i class="fas fa-lock"></i> MASUD ADMIN</h2>
        <input type="password" id="passwordInput" placeholder="password (masud511)" onkeypress="if(event.key==='Enter') login()">
        <button onclick="login()"><i class="fas fa-sign-in-alt"></i> প্রবেশ</button>
        <div class="error-message" id="loginError">vul password!</div>
    </div>

    <!-- admin panel -->
    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h1>MASUD ADMIN</h1>
            <p>dual send option</p>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> logout</button>
        </div>

        <!-- input form -->
        <div class="input-form" id="inputForm">
            <h2 style="margin-bottom: 20px;">➕ notun item</h2>
            
            <div class="form-group">
                <label><i class="fas fa-image"></i> image link (imgbb)</label>
                <input type="url" id="imageUrl" placeholder="https://ibb.co.com/... ba https://i.ibb.co/...">
                <small>imgbb er page link ba direct link dilei hobe</small>
            </div>

            <div class="form-group">
                <label><i class="fas fa-code"></i> HTML code</label>
                <textarea id="htmlCode" class="code-editor" placeholder="..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-paint-brush"></i> CSS code</label>
                <textarea id="cssCode" class="code-editor" placeholder="..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fab fa-js"></i> JavaScript code</label>
                <textarea id="jsCode" class="code-editor" placeholder="..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-tag"></i> AI option (optional)</label>
                <select id="aiOption">
                    <option value="">no AI</option>
                    <option value="chat">chatbot</option>
                    <option value="analyze">analysis</option>
                    <option value="optimize">optimize</option>
                </select>
            </div>

            <!-- button group: preview first, then two send buttons -->
            <div class="button-group" style="flex-direction: column;">
                <button class="btn btn-secondary" onclick="previewCode()" style="width:100%;">
                    <i class="fas fa-eye"></i> prothome preview dekun (save hobe na)
                </button>
                <div style="display: flex; gap: 10px; width:100%;">
                    <button class="btn btn-preview-only" onclick="sendItem('previewOnly')" style="flex:1;">
                        <i class="fas fa-image"></i> shudhu preview pathan
                    </button>
                    <button class="btn btn-preview-code" onclick="sendItem('previewAndCode')" style="flex:1;">
                        <i class="fas fa-code"></i> preview + code pathan
                    </button>
                </div>
                <button class="btn btn-secondary" onclick="resetForm()" style="width:100%;">
                    <i class="fas fa-undo"></i> reset
                </button>
            </div>
        </div>

        <!-- uploaded items list -->
        <div class="input-form">
            <h2 style="margin-bottom: 20px;">📦 uploaded items</h2>
            <div class="cards-grid" id="cardsList"></div>
        </div>
    </div>

    <!-- preview modal -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <button class="preview-close" onclick="closePreviewModal()">×</button>
            <h2>🔍 live preview</h2>
            <iframe class="preview-iframe" id="previewFrame"></iframe>
        </div>
    </div>

    <!-- notification & loader -->
    <div class="notification" id="notification"><i class="fas fa-check-circle"></i> <span id="notificationMessage"></span></div>
    <div class="loader" id="loader"><div class="loader-spinner"></div></div>

    <script>
        const CORRECT_PASSWORD = "masud511";
        let cards = JSON.parse(localStorage.getItem('masudCards')) || [];

        (function checkLogin() {
            if (sessionStorage.getItem('masudAdminLoggedIn') === 'true') showAdminPanel();
            else showLoginForm();
        })();

        function login() {
            if (document.getElementById('passwordInput').value === CORRECT_PASSWORD) {
                sessionStorage.setItem('masudAdminLoggedIn', 'true');
                showAdminPanel();
                document.getElementById('loginError').style.display = 'none';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('masudAdminLoggedIn');
            showLoginForm();
        }

        function showAdminPanel() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            renderCards();
        }

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }

        function fixImgbbLink(url) {
            if (!url) return '';
            if (url.includes('i.ibb.co')) return url;
            const match = url.match(/ibb\.co(?:\/com)?\/([a-zA-Z0-9]+)/);
            return match ? `https://i.ibb.co.com/${match[1]}/image.jpg` : url;
        }

        // preview only (does not save)
        function previewCode() {
            const html = document.getElementById('htmlCode').value.trim() || '';
            const css = document.getElementById('cssCode').value.trim() || '';
            const js = document.getElementById('jsCode').value.trim() || '';
            const fullHTML = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
            document.getElementById('previewFrame').srcdoc = fullHTML;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.remove('active');
        }

        // send item with type: 'previewOnly' or 'previewAndCode'
        function sendItem(type) {
            let imageUrl = document.getElementById('imageUrl').value.trim();
            const html = document.getElementById('htmlCode').value.trim();
            const css = document.getElementById('cssCode').value.trim();
            const js = document.getElementById('jsCode').value.trim();
            const ai = document.getElementById('aiOption').value;

            if (!imageUrl) { showNotification('image link den!', true); return; }
            if (!html && !css && !js) { showNotification('kono code den!', true); return; }

            imageUrl = fixImgbbLink(imageUrl);

            showLoader();
            setTimeout(() => {
                const newCard = {
                    id: Date.now(),
                    image: imageUrl,
                    html, css, js, ai,
                    type: type,          // 'previewOnly' or 'previewAndCode'
                    timestamp: new Date().toLocaleString()
                };
                cards.unshift(newCard);
                localStorage.setItem('masudCards', JSON.stringify(cards));
                renderCards();
                resetForm();
                hideLoader();
                showNotification(type === 'previewOnly' ? 'shudhu preview pathano holo' : 'preview+code pathano holo');
                localStorage.setItem('masudUpdate', Date.now());
            }, 500);
        }

        // render cards in admin
        function renderCards() {
            const container = document.getElementById('cardsList');
            if (!container) return;
            if (cards.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">kono item nei</p>';
                return;
            }
            container.innerHTML = cards.map((card, index) => {
                const typeLabel = card.type === 'previewOnly' ? 'shudhu preview' : 'preview+code';
                const typeClass = card.type === 'previewOnly' ? 'preview-only' : 'preview-code';
                return `
                    <div class="admin-card">
                        <div class="card-image">
                            <img src="${card.image}" onerror="this.src='https://via.placeholder.com/300x150?text=Error'">
                        </div>
                        <div class="card-body">
                            <span class="type-badge ${typeClass}">${typeLabel}</span>
                            <small style="display:block; margin:5px 0;">${card.timestamp}</small>
                            ${card.ai ? `<small>🤖 AI: ${card.ai}</small>` : ''}
                            <div class="card-actions">
                                <button class="card-btn edit" onclick="editCard(${index})"><i class="fas fa-edit"></i> edit</button>
                                <button class="card-btn delete" onclick="deleteCard(${index})"><i class="fas fa-trash"></i> delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editCard(index) {
            const card = cards[index];
            document.getElementById('imageUrl').value = card.image || '';
            document.getElementById('htmlCode').value = card.html || '';
            document.getElementById('cssCode').value = card.css || '';
            document.getElementById('jsCode').value = card.js || '';
            document.getElementById('aiOption').value = card.ai || '';
            // type is not restored in form; it will be set by which send button is used
            deleteCard(index);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteCard(index) {
            if (confirm('delete korben?')) {
                cards.splice(index, 1);
                localStorage.setItem('masudCards', JSON.stringify(cards));
                renderCards();
                showNotification('item delete hoyeche');
                localStorage.setItem('masudUpdate', Date.now());
            }
        }

        function resetForm() {
            document.getElementById('imageUrl').value = '';
            document.getElementById('htmlCode').value = '';
            document.getElementById('cssCode').value = '';
            document.getElementById('jsCode').value = '';
            document.getElementById('aiOption').value = '';
        }

        function showNotification(msg, err = false) {
            const n = document.getElementById('notification');
            document.getElementById('notificationMessage').innerText = msg;
            if (err) n.classList.add('error'); else n.classList.remove('error');
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 3000);
        }
        function showLoader() { document.getElementById('loader').classList.add('active'); }
        function hideLoader() { document.getElementById('loader').classList.remove('active'); }

        window.addEventListener('storage', (e) => {
            if (e.key === 'masudCards') {
                cards = JSON.parse(e.newValue) || [];
                renderCards();
            }
        });

        window.addEventListener('load', () => { if (sessionStorage.getItem('masudAdminLoggedIn') === 'true') renderCards(); });
    </script>
</body>
</html>
