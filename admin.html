<!DOCTYPE html>
<html>
<head>
    <title>TNM ADMIN PANEL</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #333; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid #ff4b2b; }
        h2 { color: #ff4b2b; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .btn-done { background: #38ef7d; color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #login-lock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        input#admin-pass { padding: 12px; border-radius: 5px; border: none; width: 250px; margin-bottom: 10px; text-align: center; font-size: 18px; }
    </style>
</head>
<body>
    <div id="login-lock">
        <h2 style="color: white;">🔒 Admin Access</h2>
        <input type="password" id="admin-pass" placeholder="Enter Password">
        <button class="btn-done" style="width: 250px; height: 45px;" onclick="checkPassword()">UNLOCK</button>
        <p id="error" style="color: red; display: none; margin-top: 10px;">Wrong Password!</p>
    </div>

    <div id="admin-content" style="display: none;">
        <h1>🎮 TNM RIYAD - ADMIN PANEL</h1>
        <button class="btn-done" style="background: red; color: white; margin-bottom: 20px;" onclick="location.reload()">LOGOUT</button>
        <h2>💰 User Deposits</h2>
        <div id="deposit-list">Loading Deposits...</div>
        <h2>🛡️ Match Registrations</h2>
        <div id="reg-list">Loading Registrations...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const SECRET_PASSWORD = "riyad123"; // এখানে আপনার পাসওয়ার্ড সেট করুন

        function checkPassword() {
            if(document.getElementById('admin-pass').value === SECRET_PASSWORD) {
                document.getElementById('login-lock').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminData();
            } else { document.getElementById('error').style.display = 'block'; }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyB2WdXJJNYqmos9Sl_D2wCUyMzMFujE57c",
            databaseURL: "https://tnm-a2840-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadAdminData() {
            db.ref('deposits').on('value', snap => {
                let h = ''; snap.forEach(c => { const d = c.val();
                    h += `<div class="card"><p>📧 ${d.user}</p><p>💵 ${d.amount} TK</p><p>🆔 ${d.trxID}</p>
                    <button class="btn-done" onclick="if(confirm('Delete?')) db.ref('deposits/${c.key}').remove()">Mark Done</button></div>`;
                });
                document.getElementById('deposit-list').innerHTML = h || 'No Deposits';
            });
            db.ref('registrations').on('value', snap => {
                let h = ''; snap.forEach(c => { const d = c.val();
                    h += `<div class="card" style="border-left-color:#38ef7d"><p>🏆 Match: ${d.match}</p><p>👤 Player: ${d.playerName} (${d.gameUID})</p>
                    <button class="btn-done" style="background:orange" onclick="if(confirm('Delete?')) db.ref('registrations/${c.key}').remove()">Remove</button></div>`;
                });
                document.getElementById('reg-list').innerHTML = h || 'No Registrations';
            });
        }
    </script>
</body>
</html>
