<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVOLOPER MASUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* same styles as before, no changes needed */
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; transition:all 0.3s; }
        .theme-controller { position:fixed; top:20px; right:20px; display:flex; gap:10px; z-index:1000; }
        .theme-btn { width:40px; height:40px; border-radius:50%; border:3px solid white; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
        .theme-btn[data-theme="light"] { background:linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .theme-btn[data-theme="dark"] { background:linear-gradient(135deg, #2c3e50 0%, #3498db 100%); }
        .theme-btn[data-theme="purple"] { background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .theme-btn[data-theme="green"] { background:linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .theme-btn[data-theme="orange"] { background:linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        .header { background:white; padding:30px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .header h1 { font-size:2.5em; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .container { max-width:1400px; margin:40px auto; padding:20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:30px; }
        .card { background:white; border-radius:20px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,0.2); transition:transform 0.3s; }
        .card:hover { transform:translateY(-10px); }
        .card-image { width:100%; height:200px; overflow:hidden; cursor:pointer; background:#f0f0f0; display:flex; align-items:center; justify-content:center; }
        .card-image img { width:100%; height:100%; object-fit:cover; }
        .image-error { padding:20px; text-align:center; color:#999; }
        .button-group { padding:20px; display:flex; gap:10px; }
        .btn { flex:1; padding:12px; border:none; border-radius:10px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.3s; }
        .btn-preview { background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; }
        .btn-code { background:#2c3e50; color:white; }
        .btn:only-child { width:100%; }  /* if only one button */
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:2000; padding:20px; }
        .modal.active { display:flex; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:30px; border-radius:20px; max-width:800px; width:100%; max-height:80vh; overflow-y:auto; position:relative; }
        .modal-close { position:absolute; top:15px; right:15px; width:40px; height:40px; border-radius:50%; background:#f44336; color:white; border:none; cursor:pointer; }
        .preview-iframe { width:100%; height:400px; border:2px solid #eee; border-radius:10px; }
        .code-block { background:#1e1e1e; color:#d4d4d4; padding:20px; border-radius:10px; overflow-x:auto; font-family:monospace; white-space:pre-wrap; }
        @media (max-width:768px) { .header h1 { font-size:2em; } .theme-controller { top:10px; right:10px; } }
    </style>
</head>
<body>
    <div class="theme-controller">
        <div class="theme-btn" data-theme="light" onclick="changeTheme('light')"></div>
        <div class="theme-btn" data-theme="dark" onclick="changeTheme('dark')"></div>
        <div class="theme-btn" data-theme="purple" onclick="changeTheme('purple')"></div>
        <div class="theme-btn" data-theme="green" onclick="changeTheme('green')"></div>
        <div class="theme-btn" data-theme="orange" onclick="changeTheme('orange')"></div>
    </div>

    <div class="header">
        <h1>DEVOLOPER MASUD</h1>
        <p>creative code showcase</p>
    </div>

    <div class="container" id="cardContainer">loading...</div>

    <!-- preview modal -->
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closePreview()">×</button>
            <h2 style="margin-bottom:20px;">🔍 preview</h2>
            <iframe class="preview-iframe" id="previewFrame"></iframe>
        </div>
    </div>

    <!-- code modal -->
    <div class="modal" id="codeModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCode()">×</button>
            <h2 style="margin-bottom:20px;">📝 code</h2>
            <pre class="code-block" id="codeDisplay"></pre>
        </div>
    </div>

    <script>
        // theme functions
        function changeTheme(theme) {
            const gradients = {
                light: 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)',
                dark: 'linear-gradient(135deg, #2c3e50 0%, #3498db 100%)',
                purple: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                green: 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)',
                orange: 'linear-gradient(135deg, #f12711 0%, #f5af19 100%)'
            };
            document.body.style.background = gradients[theme];
            localStorage.setItem('masudTheme', theme);
        }
        const savedTheme = localStorage.getItem('masudTheme');
        if (savedTheme) changeTheme(savedTheme);

        let cards = [];

        function loadCards() {
            try {
                const saved = localStorage.getItem('masudCards');
                if (saved) {
                    cards = JSON.parse(saved);
                } else {
                    cards = [];
                }
            } catch (e) {
                console.error('error loading cards:', e);
                cards = [];
            }
            renderCards();
        }

        function fixImageUrl(url) {
            if (!url) return '';
            if (url.includes('i.ibb.co')) return url;
            const match = url.match(/ibb\.co(?:\/com)?\/([a-zA-Z0-9]+)/);
            return match ? `https://i.ibb.co.com/${match[1]}/image.jpg` : url;
        }

        function renderCards() {
            const container = document.getElementById('cardContainer');
            if (!cards || cards.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:white; grid-column:1/-1;">kono item nei</div>';
                return;
            }

            container.innerHTML = cards.map((card, index) => {
                const imageUrl = fixImageUrl(card.image);
                // determine buttons based on type
                let buttons = '';
                if (card.type === 'previewOnly') {
                    // only preview button
                    buttons = `<button class="btn btn-preview" onclick="showPreview(${index})"><i class="fas fa-eye"></i> preview</button>`;
                } else {
                    // both buttons
                    buttons = `
                        <button class="btn btn-preview" onclick="showPreview(${index})"><i class="fas fa-eye"></i> preview</button>
                        <button class="btn btn-code" onclick="showCode(${index})"><i class="fas fa-code"></i> code</button>
                    `;
                }
                return `
                    <div class="card">
                        <div class="card-image" onclick="showPreview(${index})">
                            <img src="${imageUrl}" 
                                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=image-error>❌ image load hoyni<br><small>${card.image}</small></div>';"
                                 alt="project image">
                        </div>
                        <div class="button-group">
                            ${buttons}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showPreview(index) {
            const card = cards[index];
            const fullHTML = `
                <!DOCTYPE html>
                <html>
                <head><style>${card.css || ''}</style></head>
                <body>${card.html || ''}<script>${card.js || ''}<\/script></body>
                </html>
            `;
            document.getElementById('previewFrame').srcdoc = fullHTML;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        function showCode(index) {
            const card = cards[index];
            const fullCode = `<!-- HTML -->\n${card.html || ''}\n\n/* CSS */\n${card.css || ''}\n\n// JavaScript\n${card.js || ''}`;
            document.getElementById('codeDisplay').textContent = fullCode;
            document.getElementById('codeModal').classList.add('active');
        }

        function closeCode() {
            document.getElementById('codeModal').classList.remove('active');
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'masudCards') {
                loadCards();
            }
        });

        setInterval(() => {
            const saved = localStorage.getItem('masudCards');
            if (saved) {
                const newCards = JSON.parse(saved);
                if (JSON.stringify(newCards) !== JSON.stringify(cards)) {
                    cards = newCards;
                    renderCards();
                }
            }
        }, 2000);

        window.addEventListener('load', loadCards);
    </script>
</body>
</html>
